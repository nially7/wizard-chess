/* ===================== Heading ===================== */
.hp-kicker {
  font-family: var(--serif-ko);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 3px;
  color: var(--ink-3);
}
.hp-num {
  font-family: var(--serif-en);
  font-weight: 700;
  color: var(--crimson);
  margin-right: 10px;
  letter-spacing: 0;
}
.hp-title {
  margin-top: 6px;
  font-family: var(--serif-ko);
  font-size: 27px;
  font-weight: 700;
  letter-spacing: 2px;
  line-height: 1.25;
  color: var(--ink);
  text-shadow: 0 0 1px rgba(42,26,11,.45), 0 1px 0 rgba(255,246,222,.6);
}
.hp-flourish {
  position: relative;
  height: 14px;
  margin: 8px auto 16px;
  max-width: 260px;
  background:
    linear-gradient(90deg, transparent, #8a6a2e 30%, #8a6a2e 44%, transparent 46%, transparent 54%, #8a6a2e 56%, #8a6a2e 70%, transparent) center / 100% 1px no-repeat,
    linear-gradient(90deg, transparent 15%, rgba(138,106,46,.5) 35%, transparent 45%, transparent 55%, rgba(138,106,46,.5) 65%, transparent 85%) center 10px / 100% 1px no-repeat;
}
.hp-flourish::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 8px;
  height: 8px;
  background: #8b1a1a;
  transform: translate(-50%, -50%) rotate(45deg);
}

/* ===================== Date / Weather / Place ===================== */
.hp-cols {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
}
.hp-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  padding: 2px 10px;
}
.hp-col + .hp-col { border-left: 1px solid rgba(110,78,30,.3); }
.hp-k {
  font-family: var(--serif-ko);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 5px;
  padding-left: 5px;
  color: var(--crimson);
}
.hp-v {
  font-size: 14.5px;
  line-height: 1.45;
  color: var(--ink);
  word-break: keep-all;
}

/* ===================== Wax seal ===================== */
.hp-seal {
  position: absolute;
  top: -14px;
  right: 20px;
  width: 62px;
  height: 62px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 48% 52% 45% 55% / 55% 47% 53% 45%;
  transform: rotate(-12deg);
  filter: drop-shadow(0 3px 3px rgba(0,0,0,.45));
}
.hp-seal-canon {
  background:
    radial-gradient(circle at 34% 28%, rgba(255,200,180,.45), transparent 26%),
    radial-gradient(circle at 50% 55%, #a3201f 0 48%, #6e0f10 74%, #4d0909 100%);
}
.hp-seal-if {
  background:
    radial-gradient(circle at 34% 28%, rgba(200,255,220,.35), transparent 26%),
    radial-gradient(circle at 50% 55%, #1f5a43 0 48%, #123a2b 74%, #0a2419 100%);
}
.hp-seal span {
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  box-shadow: inset 0 2px 3px rgba(0,0,0,.45), 0 1px 0 rgba(255,220,200,.25);
  font-family: var(--serif-ko);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 1px;
  color: rgba(255,226,205,.9);
  text-shadow: 0 -1px 0 rgba(0,0,0,.55);
}
.hp-seal-if span { font-family: var(--serif-en); font-size: 15px; }

/* ===================== Allegiance: stamps (D.A. / Order) and the carved Dark Mark ===================== */
.hp-stamp {
  position: relative; flex: none; width: 57px; height: 69px; z-index: 2;
  transform: rotate(7deg); filter: drop-shadow(0 2px 2px rgba(0,0,0,.45));
}
.hp-stamp svg { display: block; width: 100%; height: 100%; }
.hp-affil { position: absolute; left: 20px; top: 16px; z-index: 3; display: flex; align-items: flex-start; gap: 6px; pointer-events: none; }
.hp-affil .hp-stamp + .hp-stamp { margin-left: -14px; margin-top: 8px; }
.hp-affil-over .hp-dmark + .hp-stamp { margin-left: -24px; margin-top: 14px; }   /* stuck on over the carved mark */
.hp-stamp.hp-stamp-burnt { transform: none; filter: drop-shadow(0 2px 2px rgba(0,0,0,.45)); }   /* the carved mark stays upright */
.hp-stamp-burnt svg { position: relative; z-index: 1; overflow: visible; }
.hp-stamp-burnt .hp-dmark { position: absolute; z-index: 0; left: 11.5px; top: -10.5px; }
.hp-stamp-burnt .dm-smoke { z-index: 2; bottom: 50%; }
.hp-ember { animation: hpEmber 2.4s ease-in-out infinite; }
@keyframes hpEmber { 0%,100% { opacity: .25; } 40% { opacity: .6; } 55% { opacity: .35; } 70% { opacity: .55; } }
.hp-stamp-order { transform: rotate(-6deg); }
.hp-stamp::after {   /* a faint postmark over the corner */
  content: ""; position: absolute; left: -18px; top: 6px; width: 36px; height: 36px; border-radius: 50%;
  border: 1.5px solid rgba(40,30,20,.5);
  background: repeating-linear-gradient(0deg, transparent 0 5px, rgba(40,30,20,.3) 5px 6px);
  opacity: .5; pointer-events: none;
}
.hp-dmark {
  position: relative; flex: none; width: 34px; height: 90px; z-index: 1; pointer-events: none;
}
.hp-dmark svg { position: relative; z-index: 2; display: block; width: 100%; height: 100%; }
.hp-dmark .dm-rim { fill: rgba(255,236,200,.45); }
.hp-dmark .dm-cut { fill: #1f130a; filter: drop-shadow(0 -1px 0 rgba(0,0,0,.6)); }
.hc .hp-dmark .dm-rim { fill: rgba(205,245,215,.8); }
.hc .hp-dmark .dm-cut { stroke: rgba(255,255,255,.85); stroke-width: 5px; paint-order: stroke; }
.hc .dm-smoke { background: radial-gradient(circle, rgba(170,180,170,.45), rgba(170,180,170,0) 70%); }
.hc .hp-dmark .dm-cut { fill: #030806; filter: drop-shadow(0 0 3px rgba(120,220,150,.35)); }
.dm-smoke {
  position: absolute; z-index: 1; left: 50%; bottom: 40%; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%;
  background: radial-gradient(circle, rgba(10,10,8,.7), rgba(10,10,8,0) 70%); filter: blur(3px); opacity: 0;
  animation: dmSmoke 6s ease-out infinite;
}
.dm-smoke.s2 { animation-delay: 1.5s; left: 38%; }
.dm-smoke.s3 { animation-delay: 3s; left: 62%; }
.dm-smoke.s4 { animation-delay: 4.5s; left: 46%; width: 28px; height: 28px; }
@keyframes dmSmoke {
  0% { transform: translate(0, 0) scale(.5); opacity: 0; }
  15% { opacity: .75; }
  100% { transform: translate(6px, -54px) scale(2.2); opacity: 0; }
}
@container (max-width: 480px) {
  .hp-affil { left: 10px; top: 10px; }
  .hp-stamp { width: 42px; height: 51px; }
  .hp-dmark { width: 25px; height: 66px; }
  .hp-stamp-burnt .hp-dmark { left: 8.5px; top: -7.5px; }
}

/* ===================== Setup ===================== */
.hp-wrap-setup { max-width: 600px; }
.hp-wrap-setup .hp-paper { padding: 40px 38px 34px; }
.hp-en {
  font-family: var(--serif-en);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: var(--ink-3);
}
.hp-logo-text {
  margin: 4px 0 2px;
  font-family: var(--serif-ko);
  font-size: 32px;
  font-weight: 800;
  letter-spacing: 4px;
  line-height: 1.3;
  color: var(--ink);
  text-align: center;
  word-break: keep-all;
  filter: drop-shadow(0 6px 8px rgba(60,30,5,.45)) drop-shadow(0 1px 1px rgba(40,20,0,.5));
}
.hp-title-xl { font-size: 34px; letter-spacing: 6px; margin-top: 8px; }
.hp-lead {
  font-size: 14px;
  color: var(--ink-2);
  margin-bottom: 6px;
}
.hp-sec { margin-top: 24px; }
.hp-sec-t {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 6px;
  font-family: var(--serif-ko);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 6px;
  color: var(--crimson);
}
.hp-sec-t::before, .hp-sec-t::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(110,78,30,.5));
}
.hp-sec-t::after { background: linear-gradient(90deg, rgba(110,78,30,.5), transparent); }
.hp-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  column-gap: 22px;
}
.hp-list-1 { grid-template-columns: 1fr; }
.hp-list-1 .hp-item { justify-content: center; text-align: center; }
.hp-item small { font-size: .8em; color: var(--ink-2); font-weight: 400; margin-left: 4px; }
.hp-list-3 { grid-template-columns: 1fr 1fr 1fr; column-gap: 14px; }
.hp-list-3 .hp-item { justify-content: center; text-align: center; flex-direction: column; gap: 3px; padding: 10px 2px; }
.hp-list-3 .hp-item.hp-on::after { margin: 4px auto 0; }
.hp-list-4 { grid-template-columns: 1fr 1fr; column-gap: 14px; }
.hp-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px 4px;
  background: none;
  border: 0;
  border-bottom: 1px solid rgba(110,78,30,.18);
  cursor: pointer;
  text-align: left;
  font-family: var(--body-ko);
  font-size: 15px;
  color: rgba(42,26,11,.55);
  transition: color .15s;
}
.hp-item:hover { color: var(--ink); }
.hp-item i {
  font-style: normal;
  font-family: var(--serif-en);
  font-weight: 700;
  font-size: 13px;
  width: 22px;
  text-align: center;
  color: #a88b5a;
}
.hp-item.hp-on {
  color: var(--ink);
  font-weight: 700;
}
.hp-item.hp-on i { color: var(--crimson); }
.hp-item.hp-on::after {
  content: "";
  margin-left: auto;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #d65a4a, #8b1a1a 60%, #5a0b0b);
  box-shadow: 0 1px 1px rgba(0,0,0,.35);
}
.hp-check i {
  width: 14px;
  height: 14px;
  margin: 0 4px;
  border: 1.5px solid var(--ink-3);
  border-radius: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.hp-check.hp-on i { background: var(--crimson); border-color: var(--crimson); }
.hp-check.hp-on i::before { content: "✓"; font-family: sans-serif; font-size: 10px; color: #f6e7c8; }
.hp-check.hp-on::after { display: none; }

.hp-begin-wrap { margin-top: 30px; display: flex; flex-direction: column; align-items: center; }
.hp-begin {
  width: 88px;
  height: 88px;
  border: 0;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 47% 53% 46% 54% / 54% 46% 54% 46%;
  background:
    radial-gradient(circle at 34% 28%, rgba(255,200,180,.45), transparent 26%),
    radial-gradient(circle at 50% 55%, #a3201f 0 48%, #6e0f10 74%, #4d0909 100%);
  filter: drop-shadow(0 4px 4px rgba(0,0,0,.45));
  transform: rotate(-6deg);
  transition: transform .2s;
}
.hp-begin:hover { transform: rotate(0deg) scale(1.04); }
.hp-begin span {
  width: 62px;
  height: 62px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  box-shadow: inset 0 2px 4px rgba(0,0,0,.5), 0 1px 0 rgba(255,220,200,.25);
  font-family: var(--serif-ko);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 3px;
  padding-left: 3px;
  color: rgba(255,226,205,.92);
  text-shadow: 0 -1px 0 rgba(0,0,0,.55);
}
.hp-begin-cap {
  margin-top: 10px;
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--ink-2);
}

/* ===================== Ribbon (after start) ===================== */
.hp-ribbon {
  display: flex !important;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 8px 12px;
  max-width: 600px;
  margin: 12px auto 4px;
  padding: 10px 18px;
  font-family: 'Gowun Batang', serif;
  font-size: 13px;
  color: #ecdcb2;
  background:
    linear-gradient(180deg, rgba(255,255,255,.04), transparent 40%),
    linear-gradient(90deg, #2a1b10, #3b2717 50%, #2a1b10);
  border-top: 1px solid #8a6a2e;
  border-bottom: 1px solid #8a6a2e;
  box-shadow: 0 6px 12px rgba(0,0,0,.35);
}
.hp-rb-start { font-family: 'Hahmlet', serif; font-weight: 700; letter-spacing: 1px; }
.hp-rb-dot { color: #8a6a2e; font-size: 8px; }
.hp-rb-canon { color: #e6a59a; }
.hp-rb-if { color: #8fd1b0; }
.hp-rb-ts { color: #c9b48a; }
.hp-rb-role { color: #f0dca8; font-weight: 700; }
.hp-rb-btn {
  font-family: 'Hahmlet', serif;
  font-size: 11px;
  letter-spacing: 2px;
  padding: 3px 10px;
  background: transparent;
  color: #c9a35a;
  border: 1px solid #8a6a2e;
  cursor: pointer;
}

.ft {
  position: relative; padding: 28px 22px 24px; text-align: center; color: #e6e9e4;
  font-family: 'Gowun Batang', serif;
  background:
    radial-gradient(ellipse 60% 40% at 50% 0%, rgba(120,200,140,.10), transparent 70%),
    radial-gradient(ellipse 80% 50% at 50% 110%, rgba(30,90,50,.35), transparent 70%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.015) 0 1px, transparent 1px 7px),
    linear-gradient(180deg, #121815, #0b100d 60%, #060807);
  border: 1px solid #5f7f69; outline: 3px double #2e4a37; outline-offset: -8px; border-radius: 3px;
  box-shadow: 0 14px 30px rgba(0,0,0,.65), inset 0 0 50px rgba(0,0,0,.6);
}
.ft-kicker { font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: #8fb79a; }
.ft-title {
  margin-top: 6px; font-family: 'Hahmlet', serif; font-size: 26px; font-weight: 800; letter-spacing: 6px; padding-left: 6px;
  color: #eef3ee; text-shadow: 0 0 16px rgba(110,200,140,.35), 0 2px 4px rgba(0,0,0,.8);
}
.ft-rule { height: 1px; margin: 16px auto; width: 70%; background: linear-gradient(90deg, transparent, #5f7f69, transparent); }
.ft-lead { font-size: 14px; line-height: 1.85; letter-spacing: .5px; color: #d6dcd6; word-break: keep-all; }
.ft-lead b { color: #9fe0b0; font-weight: 700; }
.ft-q { margin: 16px 0 12px; font-size: 13px; color: #b9c9bd; letter-spacing: 1px; word-break: keep-all; }
.ft-pick {
  display: block; width: 100%; margin: 8px 0 0; padding: 12px 14px; cursor: pointer; font: inherit; text-align: center;
  border-radius: 3px; transition: transform .15s, box-shadow .15s;
}
.ft-pick b { display: block; font-size: 15.5px; letter-spacing: 2px; }
.ft-pick small { display: block; margin-top: 3px; font-size: 11.5px; letter-spacing: 1px; opacity: .85; }
.ft-pick:hover { transform: translateY(-1px); }
.ft-free { color: #102016; background: linear-gradient(180deg, #e9f3e4, #bcd6b8); border: 1px solid #e9f3e4; box-shadow: 0 0 16px rgba(190,230,190,.25); }
.ft-dark { color: #c7f0d2; background: linear-gradient(180deg, #1d2a22, #0e1511); border: 1px solid #3e6b4c; box-shadow: inset 0 0 18px rgba(60,180,100,.18); }
.ft-dark:hover { box-shadow: inset 0 0 18px rgba(60,180,100,.3), 0 0 14px rgba(40,160,80,.35); }
.ft-how { color: #e3ece4; background: linear-gradient(180deg, #1a241e, #111813); border: 1px solid #5f7f69; }
.ft-how b { font-size: 14.5px; letter-spacing: 1px; }
.ft-how:hover { border-color: #a9d4b4; box-shadow: 0 0 12px rgba(160,220,180,.18); }
.ft-own { border-style: dashed; color: #f2f7ee; }
.ft-back { margin-top: 12px; background: none; border: 0; color: #7f9686; font: inherit; font-size: 12px; letter-spacing: 1px; cursor: pointer; }
.ft-back:hover { color: #b9c9bd; }
.ft-how-sel { margin-top: 10px; display: inline-block; padding: 4px 14px; border: 1px solid #5f7f69; border-radius: 12px; font-size: 12.5px; color: #cfe3d4; }
.ft-result { margin: 4px auto 0; padding: 14px; border-radius: 3px; }
.ft-result b { display: block; font-family: 'Hahmlet', serif; font-size: 20px; letter-spacing: 4px; }
.ft-result small { display: block; margin-top: 4px; font-size: 12.5px; letter-spacing: 1px; color: #c3cdc5; }
.ft-r-free b { color: #f2f7ee; text-shadow: 0 0 12px rgba(220,245,215,.45); }
.ft-r-dark b { color: #8ff0a8; text-shadow: 0 0 14px rgba(60,220,110,.55); }
.ft-note { margin-top: 14px; font-size: 11px; letter-spacing: 1px; color: #7f9686; word-break: keep-all; }
@container (max-width: 480px) { .ft { padding: 22px 14px 20px; } .ft-title { font-size: 22px; letter-spacing: 4px; } }

/* ===================== First Task : dragon bag ===================== */
.hp-wrap-dg { max-width: 440px; margin-top: 30px; filter: none; }
.dg {
  position: relative;
  padding: 26px 22px 24px;
  text-align: center;
  color: #f1e3c4;
  font-family: 'Gowun Batang', serif;
  background:
    radial-gradient(ellipse 70% 45% at 50% 100%, rgba(255,120,40,.28), transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 0%, rgba(255,190,110,.10), transparent 70%),
    repeating-linear-gradient(135deg, rgba(255,255,255,.02) 0 2px, transparent 2px 6px),
    linear-gradient(180deg, #2a1a12, #170d08 60%, #0d0705);
  border: 1px solid #b07a35;
  outline: 3px double #8a5a22;
  outline-offset: -8px;
  border-radius: 3px;
  box-shadow: 0 14px 28px rgba(0,0,0,.6), inset 0 0 40px rgba(0,0,0,.55);
}
.dg-kicker {
  font-family: 'Cinzel', serif;
  font-size: 10px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: #d4a24f;
}
.dg-title {
  margin-top: 6px;
  font-family: 'Hahmlet', serif;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: 6px;
  padding-left: 6px;
  color: #ffe6b0;
  text-shadow: 0 0 14px rgba(255,140,40,.45), 0 2px 4px rgba(0,0,0,.7);
}
.dg-date { margin-top: 6px; font-size: 12.5px; letter-spacing: 1px; color: #c9ad7d; word-break: keep-all; }
.dg-rule {
  position: relative;
  height: 9px;
  margin: 14px auto;
  max-width: 180px;
  background: linear-gradient(90deg, transparent, #b07a35 30%, #b07a35 44%, transparent 46%, transparent 54%, #b07a35 56%, #b07a35 70%, transparent) center / 100% 1px no-repeat;
}
.dg-rule::after {
  content: "";
  position: absolute;
  left: 50%; top: 50%;
  width: 5px; height: 5px;
  background: #e0782a;
  transform: translate(-50%, -50%) rotate(45deg);
}
.dg-lead { font-size: 14px; line-height: 1.8; letter-spacing: 1px; color: #f1e3c4; }
.dg-bag {
  display: block;
  width: 120px;
  height: 130px;
  margin: 14px auto 4px;
  padding: 0;
  background: none;
  border: 0;
  cursor: pointer;
  filter: drop-shadow(0 8px 10px rgba(0,0,0,.6)) drop-shadow(0 0 18px rgba(255,140,40,.25));
  transition: transform .2s;
}
.dg-bag:hover { transform: translateY(-3px) rotate(-3deg); }
.dg-tap {
  display: inline-block;
  padding: 3px 14px;
  font-size: 12px;
  letter-spacing: 2px;
  color: #1a0f08;
  background: linear-gradient(180deg, #f0c56a, #c88a2c);
  border-radius: 12px;
}
.dg-note { margin-top: 12px; font-size: 11px; letter-spacing: 1px; color: #b8956a; word-break: keep-all; }
.dg-result {
  display: block;
  width: 100%;
  margin: 2px auto 8px;
  padding: 0;
  background: none;
  border: 0;
  color: inherit;
  cursor: default;
}
.dg-en, .dg-m-en {
  display: block;
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 22px;
  letter-spacing: 2px;
  color: #ffd27a;
  text-shadow: 0 0 16px rgba(255,120,30,.5), 0 2px 4px rgba(0,0,0,.7);
}
.dg-ko, .dg-m-ko {
  display: block;
  margin-top: 4px;
  font-family: 'Hahmlet', serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 4px;
  color: #f1e3c4;
}
.dg-desc { font-size: 13.5px; line-height: 1.75; color: #e2cfa8; word-break: keep-all; }

/* draw result window */
.dg-dialog {
  position: relative;
  width: 100%;
  max-width: 340px;
  padding: 30px 22px 22px;
  text-align: center;
  color: #f1e3c4;
  font-family: 'Gowun Batang', serif;
  background:
    radial-gradient(ellipse 80% 60% at 50% 100%, rgba(255,110,30,.35), transparent 70%),
    linear-gradient(180deg, #2a1a12, #120a06);
  border: 1px solid #c88a2c;
  outline: 3px double #8a5a22;
  outline-offset: -8px;
  border-radius: 3px;
  box-shadow: 0 0 60px rgba(255,120,30,.35), 0 20px 50px rgba(0,0,0,.7);
}
.dg-m-en { font-size: 26px; margin-top: 10px; }
.dg-m-ko { font-size: 17px; }
.dg-ok {
  margin-top: 18px;
  padding: 6px 28px;
  font-family: 'Hahmlet', serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 4px;
  color: #1a0f08;
  background: linear-gradient(180deg, #f0c56a, #c88a2c);
  border: 0;
  border-radius: 2px;
  cursor: pointer;
}

/* ===================== Mobile / narrow chat ===================== */
.hp-wrap { container-type: inline-size; }
.hp-k, .hp-kicker { white-space: nowrap; }

@container (max-width: 480px) {
  .hp-paper { padding: 30px 18px 22px; }
  .hc { padding: 58px 16px 22px; }
  .hc-ribbon { font-size: 13px; letter-spacing: 5px; text-indent: 5px; padding: 6px 28px 7px; }
  .hc-kicker { font-size: 10.5px; letter-spacing: 1px; }
  .hc-title { font-size: 22px; letter-spacing: 1px; }
  .hc-cols { grid-template-columns: 1fr; gap: 9px; max-width: 290px; margin: 0 auto; }
  .hc-col { display: grid; grid-template-columns: 44px 1fr; align-items: baseline; column-gap: 12px; padding: 0; text-align: left; }
  .hc-col + .hc-col { border-left: 0; }
  .hc-k { letter-spacing: 2px; margin: 0; text-align: right; border-right: 1px solid var(--hc-line2); padding-right: 10px; }
  .hc-v { font-size: 14px; }
  .inv { padding: 10px; }
  .dg { padding: 22px 14px 20px; }
  .dg-title { font-size: 22px; letter-spacing: 4px; }
  .dg-en { font-size: 19px; }
  .inv-frame { padding: 22px 12px 20px; }
  .inv-title { font-size: 38px; }
  .inv-school { font-size: 7.5px; letter-spacing: 1.2px; white-space: nowrap; }
  .inv-sub { letter-spacing: 1px; font-size: 11.5px; }
  .inv-script { font-size: 30px; }
  .inv-seal { width: 50px; height: 50px; left: 16px; bottom: 16px; }
  .inv-stamp-ko { font-size: 48px; letter-spacing: 10px; padding-left: 10px; }
  .inv-stamp-in { padding: 6px 18px 5px; }
  .inv-seal span { width: 34px; height: 34px; font-size: 11px; }
  .hp-kicker { font-size: 10.5px; letter-spacing: 1px; }
  .hp-num { margin-right: 6px; }
  .hp-title { font-size: 22px; letter-spacing: 1px; }
  .hp-flourish { margin: 6px auto 14px; max-width: 200px; }

  .hp-cols {
    grid-template-columns: 1fr;
    gap: 9px;
    max-width: 290px;
    margin: 0 auto;
  }
  .hp-col {
    display: grid;
    grid-template-columns: 44px 1fr;
    align-items: baseline;
    column-gap: 12px;
    padding: 0;
    text-align: left;
  }
  .hp-col + .hp-col { border-left: 0; }
  .hp-k {
    letter-spacing: 2px;
    padding-left: 0;
    text-align: right;
    border-right: 1px solid rgba(110,78,30,.35);
    padding-right: 10px;
  }
  .hp-v { font-size: 14px; }

  .hp-seal { width: 46px; height: 46px; top: -10px; right: 6px; }
  .hp-seal span { width: 32px; height: 32px; font-size: 11px; }
  .hp-seal-if span { font-size: 13px; }

  .hp-wrap-setup .hp-paper { padding: 34px 16px 28px; }
  .hp-en { font-size: 9.5px; letter-spacing: 3px; }
  .hp-title-xl { font-size: 26px; letter-spacing: 3px; }
  .hp-logo-text { font-size: 24px; letter-spacing: 2px; }
  .hp-lead { font-size: 13px; }
  .hp-sec-t { letter-spacing: 4px; gap: 10px; }
  .hp-list { column-gap: 10px; }
  .hp-item { font-size: 13.5px; padding: 9px 2px; gap: 6px; word-break: keep-all; }
  .hp-check { font-size: 12.5px; letter-spacing: -.2px; }
  .hp-item i { width: 18px; font-size: 12px; }
  .hp-list-3 { column-gap: 4px; }
  .hp-list-4 { column-gap: 8px; }
  .hp-list-3 .hp-item { font-size: 12.5px; word-break: keep-all; }
  .hp-begin { width: 76px; height: 76px; }
  .hp-begin span { width: 54px; height: 54px; font-size: 16px; }
}

@media (max-width: 520px) {
  .hp-ribbon { gap: 6px 10px; padding: 9px 12px; font-size: 12px; }
}

/* ===== Quidditch ===== */
.qd{--a:#3fae6a;--a2:#9ff0bd;--m:#c7ccd4;--bg1:#0f1a14;--bg2:#08100b;
 container-type:inline-size;max-width:640px;margin:16px auto;position:relative;padding:16px;color:#e9e4d6;
 font-family:Hahmlet,'Noto Serif CJK KR',serif;
 background:radial-gradient(90% 60% at 20% 0%,color-mix(in srgb,var(--a) 14%,transparent),transparent 70%),
  repeating-linear-gradient(45deg,rgba(255,255,255,.015) 0 1px,transparent 1px 6px),linear-gradient(var(--bg1),var(--bg2));
 border:2px solid var(--m);box-shadow:inset 0 0 0 4px #050806,inset 0 0 0 5px color-mix(in srgb,var(--m) 45%,transparent),0 16px 40px rgba(0,0,0,.7)}
.qd-gryffindor{--a:#d2463a;--a2:#ffb08a;--m:#d8b25a;--bg1:#1c0e0c;--bg2:#0e0706}
.qd-slytherin{--a:#3fae6a;--a2:#9ff0bd;--m:#c7ccd4;--bg1:#0f1a14;--bg2:#08100b}
.qd-ravenclaw{--a:#3f7fd6;--a2:#a9cbff;--m:#c9935a;--bg1:#0c1220;--bg2:#060a12}
.qd-hufflepuff{--a:#e2b33a;--a2:#ffe08a;--m:#8a7a5a;--bg1:#17140b;--bg2:#0b0a06}
/* frame nubs */
.qd-n{position:absolute;width:14px;height:14px;border:2px solid var(--m);background:#050806;transform:rotate(45deg)}
.qd-n.tl{top:-8px;left:-8px}.qd-n.tr{top:-8px;right:-8px}.qd-n.bl{bottom:-8px;left:-8px}.qd-n.br{bottom:-8px;right:-8px}
/* header */
.qd-top{display:flex;align-items:center;gap:10px;margin:-2px 0 12px}
.qd-top::before,.qd-top::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--m))}
.qd-top::after{transform:scaleX(-1)}
.qd-plate{padding:5px 22px;background:#050806;border:2px solid var(--m);
 font-family:Cinzel,serif;font-weight:900;font-size:15px;letter-spacing:.28em;color:#fff;
 clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%)}
/* scene */
.qd-scene{display:flex;gap:14px;margin-bottom:14px}
.qd-img{position:relative;flex:0 0 46%;aspect-ratio:3/2;background:#111 center/cover no-repeat;
 border:2px solid var(--m);box-shadow:0 0 0 3px #050806,0 0 0 4px color-mix(in srgb,var(--a) 70%,transparent)}
.qd-img::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 40px rgba(0,0,0,.7)}
.qd-info{flex:1;display:flex;flex-direction:column;min-width:0}
.qd-ph{display:flex;gap:4px;margin-bottom:10px}
.qd-ph span{flex:1;text-align:center;font-size:11.5px;padding:4px 0;color:#7d7a70;background:#050806;border:1px solid #2b2a26;
 clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.qd-ph .done{color:#b8b2a2;border-color:#4a4840}
.qd-ph .on{color:#0a0a0a;font-weight:700;background:linear-gradient(var(--a2),var(--a));border-color:var(--a2)}
.qd-st{font-size:17px;font-weight:700;color:#fff;margin-bottom:6px}
.qd-st small{display:block;font-family:Cinzel,serif;font-size:10px;letter-spacing:.3em;color:var(--a2);font-weight:500;margin-bottom:2px}
.qd-sit{font-size:13.5px;line-height:1.7;color:#d9d3c2}
.qd-sit b{color:var(--a2);font-weight:600}
.qd-meta{margin-top:auto;padding-top:8px;font-size:11px;color:#8f8a7c;letter-spacing:.08em}
/* choices */
.qd-ch{position:relative;display:flex;align-items:center;gap:16px;width:100%;margin-top:10px;padding:14px 18px 14px 14px;
 text-align:left;cursor:pointer;font:inherit;color:#ddd6c4;background:linear-gradient(90deg,#0a0b0a,#121410);
 border:2px solid #4b4a44;box-shadow:inset 0 0 0 3px #050605,inset 0 0 0 4px #2a2a26;transition:all .18s}
.qd-ch::before,.qd-ch::after{content:"";position:absolute;width:10px;height:10px;border:2px solid #77746a;transition:.18s}
.qd-ch::before{top:4px;right:4px;border-left:0;border-bottom:0}
.qd-ch::after{bottom:4px;right:4px;border-left:0;border-top:0}
.qd-ico{position:relative;flex:none;width:58px;height:58px;display:flex;align-items:center;justify-content:center}
.qd-ico::before{content:"";position:absolute;inset:9px;border:2px solid var(--m);background:radial-gradient(circle,color-mix(in srgb,var(--a) 45%,#000),#050605 75%);transform:rotate(45deg)}
.qd-ico::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px dashed color-mix(in srgb,var(--m) 35%,transparent)}
.qd-ico span{position:relative;font-family:Cinzel,serif;font-weight:900;font-size:15px;color:#fff;text-shadow:0 0 8px var(--a)}
.qd-tx{flex:1;min-width:0}
.qd-tt{font-size:15px;font-weight:700;color:#fff;margin-bottom:3px}
.qd-ds{font-size:12.5px;line-height:1.6;color:#b9b2a0}
.qd-ds b{color:var(--a2);font-weight:600}
.qd-ch:hover,.qd-ch.hov{border-color:var(--a2);background:linear-gradient(90deg,color-mix(in srgb,var(--a) 22%,#0a0b0a),#121410 70%);
 box-shadow:inset 0 0 0 3px #050605,inset 0 0 0 4px var(--a),0 0 0 2px color-mix(in srgb,var(--a) 50%,transparent),0 0 22px color-mix(in srgb,var(--a) 45%,transparent);transform:translateX(4px)}
.qd-ch:hover::before,.qd-ch:hover::after,.qd-ch.hov::before,.qd-ch.hov::after{border-color:var(--a2)}
.qd-ch:hover .qd-ico::before,.qd-ch.hov .qd-ico::before{border-color:var(--a2);box-shadow:0 0 12px var(--a)}
@container (max-width:480px){.qd-scene{flex-direction:column}.qd-img{flex-basis:auto;aspect-ratio:16/9}}
.qd-crest{position:absolute;z-index:2;top:-14px;left:22px;width:54px;height:64px;background-position:center;background-size:contain;background-repeat:no-repeat;
 filter:drop-shadow(0 3px 4px rgba(0,0,0,.8)) drop-shadow(0 0 8px color-mix(in srgb,var(--a) 50%,transparent))}
.qd-wrap{display:block !important}
.qd-none{--a:#b8913f;--a2:#f0d58a;--m:#b8a07a;--bg1:#17130d;--bg2:#0b0906}
.qd-foot{display:flex;justify-content:center;margin-top:12px}
.qd-skip{font:inherit;font-size:11px;letter-spacing:.06em;color:#7f7a6c;background:none;border:0;border-bottom:1px dashed #4b4a44;padding:2px 4px;cursor:pointer}
.qd-skip:hover{color:var(--a2);border-color:var(--a2)}
.qd-done{padding:4px 6px 2px}
.qd-done .qd-ph{max-width:360px;margin:0 auto 14px}
.qd-done .qd-st{text-align:center}
.qd-log{display:flex;align-items:baseline;gap:10px;margin-top:8px;padding:10px 14px;font-size:13px;color:#b9b2a0;
 background:linear-gradient(90deg,#0a0b0a,#121410);border:1px solid #3a3934;border-left:3px solid var(--a)}
.qd-log b{flex:none;font-size:11.5px;color:var(--a2);letter-spacing:.08em}
.qd-log span{color:#fff;font-weight:600}
.qd-wait{margin-top:14px;text-align:center;color:var(--a2)}
.qd-done .qd-meta{text-align:center}

/* quidditch: inline banner + separate window */
.qd-bar{display:flex;align-items:center;gap:14px;width:100%;max-width:640px;margin:14px auto 4px;padding:12px 16px;cursor:pointer;text-align:left;
 font-family:Hahmlet,serif;color:#e9e4d6;background:radial-gradient(80% 120% at 0% 50%,color-mix(in srgb,var(--a) 22%,transparent),transparent 70%),linear-gradient(var(--bg1),var(--bg2));
 border:2px solid var(--m);box-shadow:inset 0 0 0 3px #050605,inset 0 0 0 4px color-mix(in srgb,var(--m) 40%,transparent),0 8px 22px rgba(0,0,0,.5);transition:.18s}
.qd-bar:hover{border-color:var(--a2);box-shadow:inset 0 0 0 3px #050605,inset 0 0 0 4px var(--a),0 0 20px color-mix(in srgb,var(--a) 45%,transparent)}
.qd-bar-crest{flex:none;width:40px;height:48px;background-position:center;background-size:contain;background-repeat:no-repeat;filter:drop-shadow(0 2px 3px rgba(0,0,0,.8))}
.qd-bar-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.qd-bar-k{font-family:Cinzel,serif;font-weight:700;font-size:10px;letter-spacing:.35em;color:var(--a2)}
.qd-bar-t{font-size:15px;font-weight:700;color:#fff}
.qd-bar-s{font-size:11.5px;color:#a9a392}

.de-cut-smoke{position:absolute;inset:-10%;background:radial-gradient(40% 35% at 50% 45%,rgba(60,200,100,.35),transparent 70%),radial-gradient(60% 50% at 30% 60%,rgba(20,90,45,.4),transparent 70%),radial-gradient(60% 50% at 70% 40%,rgba(20,90,45,.35),transparent 70%);
 filter:blur(18px);animation:deSmoke 4.6s ease forwards}
.de-cut-mark{position:absolute;left:50%;top:46%;width:min(22vw,150px);aspect-ratio:149/394;transform:translate(-50%,-50%) scale(.6);opacity:0;
 filter:drop-shadow(0 0 18px rgba(80,255,140,.9)) drop-shadow(0 0 50px rgba(40,200,100,.7));animation:deMark 4.6s ease forwards}
.de-cut-mark svg{width:100%;height:100%;display:block}
.de-cut-mark .dm-rim{fill:rgba(120,255,160,.25)}
.de-cut-mark .dm-cut{fill:#9dffbe}
.de-cut-tx{position:absolute;left:0;right:0;top:calc(46% + min(22vw,150px)*1.45);text-align:center;font:700 clamp(14px,2.4vw,22px)/1 Cinzel,Georgia,serif;letter-spacing:.6em;color:#9dffbe;
 text-shadow:0 0 14px rgba(80,255,140,.9);opacity:0;animation:deTx 4.6s ease forwards}
@keyframes deCut{0%{opacity:0}18%{opacity:.94}78%{opacity:.94}100%{opacity:0;visibility:hidden}}
@keyframes deSmoke{0%{opacity:0;transform:scale(.8)}40%{opacity:1}100%{opacity:0;transform:scale(1.3)}}
@keyframes deMark{0%,15%{opacity:0;transform:translate(-50%,-30%) scale(.5)}40%{opacity:1;transform:translate(-50%,-50%) scale(1)}72%{opacity:1;transform:translate(-50%,-52%) scale(1.04)}100%{opacity:0;transform:translate(-50%,-60%) scale(1.15)}}
@keyframes deTx{0%,35%{opacity:0;letter-spacing:1.2em}55%,75%{opacity:1;letter-spacing:.6em}100%{opacity:0}}
